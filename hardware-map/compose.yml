# Pinned independent deployment: reuse the existing networks, never create
# another proxy network or change the main Compose project's ownership.
name: server-atlas
services:
  server-atlas:
    extends:
      file: ../docker/compose.common.yml
      service: common-service
    image: server-atlas:local
    container_name: server-atlas
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - /var/lib/server-atlas:/state:ro
    networks:
      - proxy
      - monitoring
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
networks:
  proxy:
    external: true
    name: compose_proxy
  monitoring:
    external: true
    name: compose_monitoring
