# Game servers
# minecraft-server, rlcraft-minecraft-server, hytale-server, satisfactory-server

services:
  hytale-server:
    extends:
      file: compose.common.yml
      service: common-service
    image: hybrowse/hytale-server:latest
    container_name: hytale-server
    tty: true
    stdin_open: true
    mem_limit: 24g
    memswap_limit: 24g
    ports:
      - "5205:5520/udp"
    environment:
      HYTALE_AUTO_DOWNLOAD: "true"
      HYTALE_AUTO_UPDATE: "true"
      HYTALE_BIND: "0.0.0.0:5520"
      HYTALE_AUTH_MODE: authenticated
      HYTALE_DISABLE_SENTRY: "true"
      TZ: ${TZ}
    volumes:
      - hytale-server:/data

  matcha-minecraft-server:
    extends:
      file: compose.common.yml
      service: common-service
    image: itzg/minecraft-server:latest
    container_name: matcha-minecraft-server
    tty: true
    stdin_open: true
    stop_grace_period: 150s
    ports:
      - "36678:25565/tcp"
      - "36678:25565/udp"
    environment:
      EULA: true
      MODE: "survival"
      MOTD: "§a§lMatcha Flavoured§r Minecraft Server §8w/§r Mods: §2§nEasy Shulker Boxes§r §8&§r §2§nBundle Upgrade§r\nRunning Minecraft Version: §c§o%VERSION%§r."
      DIFFICULTY: "normal"
      OPS: |
        DanteVB
      ICON: "https://cdn.modrinth.com/data/QI0EmgZ1/65af7ebdfd49e22a3a5f93a2b0c6ac24acb1d2e3_96.webp"
      OVERRIDE_ICON: true
      ENABLE_QUERY: true
      ENABLE_COMMAND_BLOCK: true
      VIEW_DISTANCE: 16
      MEMORY: 12G
      USE_AIKAR_FLAGS: true
      TYPE: FABRIC
      VERSION_FROM_MODRINTH_PROJECTS: true
      MODRINTH_PROJECTS: |
        datapack:matcha-flavoured
        easy-shulker-boxes
        bundle-upgrade
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      RESOURCE_PACK: "https://cdn.modrinth.com/data/QI0EmgZ1/versions/RVX0a6It/Matcha_Flavoured.zip"
      RESOURCE_PACK_SHA1: "c3a927d6f178d7d13478d63fdfede08a688faca5"
      RESOURCE_PACK_ENFORCE: "TRUE"
      ALLOW_FLIGHT: true
      STOP_SERVER_ANNOUNCE_DELAY: 60
      STOP_DURATION: 60
      MAX_TICK_TIME: -1
      LOG_TIMESTAMP: true
      LOG_IPS: true

    volumes:
      - matcha-minecraft-server:/data

  minecraft-server:
    extends:
      file: compose.common.yml
      service: common-service
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    tty: true
    stdin_open: true
    stop_grace_period: 150s
    ports:
      - "36677:25565/tcp"
      - "36677:25565/udp"
    environment:
      EULA: true
      MODE: "survival"
      MOTD: "§bHardcore§r Minecraft Server\nRunning Version: §c§o%VERSION%§r."
      DIFFICULTY: "hard"
      HARDCORE: true
      OPS: |
        DanteVB
        ElVonHresvelg
      ICON: "/data/assets/hardcore-logo.png"
      OVERRIDE_ICON: true
      ENABLE_QUERY: true
      ENABLE_COMMAND_BLOCK: true
      VIEW_DISTANCE: 16
      MEMORY: 12G
      USE_AIKAR_FLAGS: true
      ALLOW_FLIGHT: true
      STOP_SERVER_ANNOUNCE_DELAY: 60
      STOP_DURATION: 60
      MAX_TICK_TIME: -1
      LOG_TIMESTAMP: true
      LOG_IPS: true
    volumes:
      - minecraft-server:/data
      - ${DATA}/minecraft/assets:/data/assets

  rlcraft-minecraft-server:
    extends:
      file: compose.common.yml
      service: common-service
    image: itzg/minecraft-server:java8
    container_name: rlcraft-minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "36676:25565/tcp"
      - "36676:25565/udp"
    environment:
      EULA: true
      MODE: "survival"
      MOTD: "§aRL Craft§r server running Minecraft §c§o%VERSION%§r."
      DIFFICULTY: "hard"
      OPS: |
        DanteVB
        Otakeb
        Heruth99
      ICON: "https://media.forgecdn.net/avatars/thumbnails/468/243/64/64/637751369169569212.png"
      OVERRIDE_ICON: true
      ENABLE_QUERY: true
      ENABLE_COMMAND_BLOCK: true
      VIEW_DISTANCE: 16
      MEMORY: 12G
      USE_AIKAR_FLAGS: true
      TYPE: "AUTO_CURSEFORGE"
      CF_API_KEY: ${CF_API_KEY}
      CF_SLUG: rlcraft
    volumes:
      - rlcraft-minecraft-server:/data

  satisfactory-server:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: satisfactory-server
    hostname: satisfactory-server
    image: wolveix/satisfactory-server:latest
    ports:
      - "7778:7777/tcp"
      - "7778:7777/udp"
      - "8888:8888/tcp"
    environment:
      PUID: ${UID}
      PGID: ${GID}
      MAXPLAYERS: 4
      STEAMBETA: false
    volumes:
      - ${DATA}/satisfactory-server:/config
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G

volumes:
  hytale-server:
  matcha-minecraft-server:
  minecraft-server:
  rlcraft-minecraft-server:
