; Defense in depth after PHP2Shell (CVE-2026-109618/109619, fixed in 8.5.12).
; Both settings are recommended by GHSA-6wmf-4rv5-p3rp even on patched PHP.
; Loaded last (zz-) so nothing in the image's conf.d re-enables them.

; Nextcloud uploads report progress client-side over chunked WebDAV; nothing
; uses PHP's session upload progress, which only widens the attack surface.
session.upload_progress.enabled = 0

; PHP 8.5 backtraces in fatal-error messages were the confirmed RCE producer.
; Nextcloud's own exception log (nextcloud.log) keeps its traces.
fatal_error_backtraces = 0
