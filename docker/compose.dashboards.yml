# Dashboard and monitoring services
# homepage, suwayomi-widget, dashdot, uptime-kuma

services:
  homepage:
    extends:
      file: compose.common.yml
      service: common-service
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');const r=http.get({socketPath:'/var/run/docker.sock',path:'/containers/json?limit=1'},s=>{process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(3000,()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_VAR_PLEX_TOKEN: ${HOMEPAGE_VAR_PLEX_TOKEN}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_VAR_JELLYFIN_KEY}
      HOMEPAGE_VAR_SEERR_KEY: ${HOMEPAGE_VAR_SEERR_KEY}
      HOMEPAGE_VAR_IMMICH_KEY: ${HOMEPAGE_VAR_IMMICH_KEY}
      HOMEPAGE_VAR_KOMGA_USER: ${HOMEPAGE_VAR_KOMGA_USER}
      HOMEPAGE_VAR_KOMGA_PASS: ${HOMEPAGE_VAR_KOMGA_PASS}
      HOMEPAGE_VAR_RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY}
      HOMEPAGE_VAR_SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY}
      HOMEPAGE_VAR_BAZARR_KEY: ${HOMEPAGE_VAR_BAZARR_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY}
      HOMEPAGE_VAR_SABNZBD_KEY: ${HOMEPAGE_VAR_SABNZBD_KEY}
      HOMEPAGE_VAR_NPM_USER: ${HOMEPAGE_VAR_NPM_USER}
      HOMEPAGE_VAR_NPM_PASS: ${HOMEPAGE_VAR_NPM_PASS}
      HOMEPAGE_VAR_TDARR_KEY: ${HOMEPAGE_VAR_TDARR_KEY}
      HOMEPAGE_VAR_QBIT_USER: ${HOMEPAGE_VAR_QBIT_USER}
      HOMEPAGE_VAR_QBIT_PASS: ${HOMEPAGE_VAR_QBIT_PASS}
      HOMEPAGE_VAR_NEXTCLOUD_USER: ${HOMEPAGE_VAR_NEXTCLOUD_USER}
      HOMEPAGE_VAR_NEXTCLOUD_PASS: ${HOMEPAGE_VAR_NEXTCLOUD_PASS}
      HOMEPAGE_VAR_ADGUARD_USERNAME: ${HOMEPAGE_VAR_ADGUARD_USERNAME}
      HOMEPAGE_VAR_ADGUARD_PASSWORD: ${HOMEPAGE_VAR_ADGUARD_PASSWORD}
      HOMEPAGE_VAR_KUMA_SLUG: ${HOMEPAGE_VAR_KUMA_SLUG}
      HOMEPAGE_VAR_GRAFANA_USER: ${HOMEPAGE_VAR_GRAFANA_USER}
      HOMEPAGE_VAR_GRAFANA_PASS: ${HOMEPAGE_VAR_GRAFANA_PASS}
      HOMEPAGE_VAR_CALIBRE_USER: ${HOMEPAGE_VAR_CALIBRE_USER}
      HOMEPAGE_VAR_CALIBRE_PASS: ${HOMEPAGE_VAR_CALIBRE_PASS}
      HOMEPAGE_VAR_SUWAYOMI_USER: ${HOMEPAGE_VAR_SUWAYOMI_USER}
      HOMEPAGE_VAR_SUWAYOMI_PASS: ${HOMEPAGE_VAR_SUWAYOMI_PASS}
      HOMEPAGE_VAR_HARDCORE_MC_IP_OR_DOMAIN: ${HOMEPAGE_VAR_HARDCORE_MC_IP_OR_DOMAIN}
      HOMEPAGE_VAR_HARDCORE_MC_PORT: ${HOMEPAGE_VAR_HARDCORE_MC_PORT}
      HOMEPAGE_VAR_MATCHA_MC_IP_OR_DOMAIN: ${HOMEPAGE_VAR_MATCHA_MC_IP_OR_DOMAIN}
      HOMEPAGE_VAR_MATCHA_MC_PORT: ${HOMEPAGE_VAR_MATCHA_MC_PORT}
      HOMEPAGE_VAR_RLCRAFT_MC_IP_OR_DOMAIN: ${HOMEPAGE_VAR_RLCRAFT_MC_IP_OR_DOMAIN}
      HOMEPAGE_VAR_RLCRAFT_MC_PORT: ${HOMEPAGE_VAR_RLCRAFT_MC_PORT}
      HOMEPAGE_VAR_CHANGEDETECTION_KEY: ${HOMEPAGE_VAR_CHANGEDETECTION_KEY}
    networks:
      - proxy
      - homepage-widgets
    volumes:
      - ${HOMEPAGE_CONFIG_PATH}:/app/config
      - /var/run/docker.sock:/var/run/docker.sock

  suwayomi-widget:
    extends:
      file: compose.common.yml
      service: common-service
    image: suwayomi-widget:latest
    build:
      context: ./dockerfiles/suwayomi-widget
      pull: true
    container_name: suwayomi-widget
    environment:
      SUWAYOMI_URL: http://suwayomi:4567
      SUWAYOMI_USERNAME: ${HOMEPAGE_VAR_SUWAYOMI_USER}
      SUWAYOMI_PASSWORD: ${HOMEPAGE_VAR_SUWAYOMI_PASS}
    networks:
      - homepage-widgets
      - suwayomi
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/stats',{headers:{Authorization:'Basic '+Buffer.from(process.env.SUWAYOMI_USERNAME+':'+process.env.SUWAYOMI_PASSWORD).toString('base64')},signal:AbortSignal.timeout(15000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  dashdot:
    extends:
      file: compose.common.yml
      service: gpu-service
    image: mauricenino/dashdot:nvidia
    container_name: dashdot
    restart: unless-stopped
    privileged: true
    networks:
      - proxy
    volumes:
      - /:/mnt/host:ro
    environment:
      DASHDOT_WIDGET_LIST: "os,cpu,storage,ram,network,gpu"
      DASHDOT_SHOW_HOST: true
      DASHDOT_ENABLE_CPU_TEMPS: true
      DASHDOT_NETWORK_LABEL_LIST: type,speed_up,speed_down,interface_speed,public_ip
      DASHDOT_ACCEPT_OOKLA_EULA: true
      DASHDOT_USE_NETWORK_INTERFACE: bond0
      DASHDOT_FS_DEVICE_FILTER: nvme1n1,sda,sdb,sdc,sdd,sde,sdf,sdg,sdh,sdi,sdj,sdk,sdl
      DASHDOT_FS_VIRTUAL_MOUNTS: /dev/mapper/vg_redundant-lv_data

  uptime-kuma:
    extends:
      file: compose.common.yml
      service: common-service
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - ${DATA}/uptime-kuma:/app/data
    networks:
      - proxy

networks:
  proxy:
  homepage-widgets:
    internal: true
  suwayomi:
