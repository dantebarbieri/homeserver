# Monitoring stack: Prometheus, Grafana, Loki, Alloy (+ its Docker socket
# proxy), node-exporter, cAdvisor
#
# Only Grafana is publicly exposed (via proxy network).
# All other services stay on the internal monitoring network — they have
# no authentication and must never be exposed publicly.

services:
  prometheus:
    extends:
      file: compose.common.yml
      service: common-service
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ${DATA}/prometheus:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring

  grafana:
    extends:
      file: compose.common.yml
      service: common-service
    image: grafana/grafana:latest
    container_name: grafana
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.danteb.com
    volumes:
      - ${DATA}/grafana:/var/lib/grafana
    networks:
      - proxy
      - monitoring
    depends_on:
      - prometheus
      - loki

  loki:
    extends:
      file: compose.common.yml
      service: common-service
    image: grafana/loki:latest
    container_name: loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ${DATA}/loki:/loki
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - monitoring

  alloy:
    extends:
      file: compose.common.yml
      service: common-service
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - ${DATA}/alloy:/var/lib/alloy
    networks:
      - monitoring
      - alloy-docker-api
    depends_on:
      - loki
      - alloy-socket-proxy

  # Read-only Docker API broker for Alloy, which no longer mounts the socket.
  #
  # Unlike Homepage's broker, this one must allow container inspect:
  # loki.source.docker calls GET /containers/{id}/json before and while tailing
  # (TTY mode and running state), then streams /containers/{id}/logs?follow=1.
  # discovery.docker lists containers and networks, and both Docker clients
  # negotiate the API version with /_ping first. Inspect still exposes container
  # Env, which is why this is a separate broker that only Alloy can reach rather
  # than a shared one; create/exec/delete and every other endpoint stay denied.
  #
  # Regexes are anchored full matches on the path (query ignored) with an
  # optional /vX.Y prefix. A `:ro` socket mount does not restrict the API.
  #
  # Holds the real socket: never join `proxy` or publish its port.
  alloy-socket-proxy:
    extends:
      file: compose.common.yml
      service: common-service
    image: wollomatic/socket-proxy:1.13.2
    container_name: alloy-socket-proxy
    # Runs as nobody; the docker group is what lets it open the socket.
    group_add:
      - "${DOCKER_GID}"
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-proxyport=2375'
      # Resolved through Docker DNS on each request: only Alloy's address on
      # alloy-docker-api is accepted, so no subnet needs pinning.
      - '-allowfrom=alloy'
      - '-allowHEAD=(/v[0-9]+\.[0-9]+)?/_ping'
      - '-allowGET=(/v[0-9]+\.[0-9]+)?/(_ping|networks|containers/(json|[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs)))'
      - '-allowhealthcheck'
      # Daemon restarts can leave this file bind mount on the replaced socket.
      # Exiting lets the restart policy remount it even if the host reconcile
      # unit has not run yet. Log streams never finish on their own, so keep
      # the shutdown grace below Docker's 10s stop timeout.
      - '-watchdoginterval=30'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - alloy-docker-api
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Checks that the mounted Docker socket still accepts connections.
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  node-exporter:
    extends:
      file: compose.common.yml
      service: common-service
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  cadvisor:
    extends:
      file: compose.common.yml
      service: common-service
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--housekeeping_interval=10s"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    networks:
      - monitoring

networks:
  proxy:
  monitoring:
  # Only Alloy and its socket broker; carries Docker API traffic.
  alloy-docker-api:
    internal: true
