# Source deploy/nginx.conf at 80be5bcd5327fc1017b73ec102c1eef60b016205,
# with exact NPM trust and capability-safe API error logging added.
map $uri $cache_control {
  ~^/(app|style)\.[0-9a-f]+\.(js|css)$ "public, max-age=31536000, immutable";
  ~^/assets/game/[a-z0-9_]+\.[0-9a-f]+\.png$ "public, max-age=31536000, immutable";
  default "no-cache";
}
limit_req_zone $binary_remote_addr zone=shares:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=share_connections:1m;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  # Recheck NPM's compose_proxy addresses before each rollout. Never trust
  # the shared proxy subnet; XFF's rightmost untrusted hop is the client.
  set_real_ip_from 192.168.128.46;
  set_real_ip_from fd2b:92df:1a5b:1::2e;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control $cache_control always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    access_log off;
    error_log /dev/null;
    client_max_body_size 64m;
    client_body_timeout 60s;
    limit_req zone=shares burst=10 nodelay;
    limit_req_status 429;
    limit_conn share_connections 4;
    limit_conn_status 429;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upload_backend uploads:8081;
    proxy_pass http://$upload_backend;
    proxy_set_header X-Upload-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
