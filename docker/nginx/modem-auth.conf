# The S33 signs HNAP requests with HNAP_AUTH. Allow it on this TLS vhost only.
underscores_in_headers on;

# Do not forward device credentials or arbitrary client headers to Authelia.
set $upstream_authelia http://authelia:9091/api/authz/auth-request;
location = /internal/authelia/authz {
    internal;
    proxy_pass $upstream_authelia;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Cookie "authelia_session=$cookie_authelia_session";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL https://modem.danteb.com$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
}
