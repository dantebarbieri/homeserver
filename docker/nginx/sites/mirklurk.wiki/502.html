<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>MirkLurk Wiki is temporarily offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #11140f;
      color: #c8cfc0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 520px;
    }

    .mark {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8fae6b;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #eef2e8;
      margin: 0.75rem 0 1rem;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #9aa38f;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="mark">MirkLurk Wiki</div>
    <h1>Temporarily offline</h1>
    <p>The wiki is down for maintenance or restarting. Nothing has been lost. Please try again in a few minutes.</p>
  </main>
</body>
</html>
