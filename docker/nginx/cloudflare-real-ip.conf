# Real client addresses for proxy hosts served through Cloudflare's proxy
# (only mirklurk.wiki). Included from that host's NPM Advanced config by
# scripts/mirklurk-wiki-proxy.sh; do not include it anywhere else.
#
# Cloudflare sets CF-Connecting-IP itself, so the header is trustworthy only
# when the connection comes from a Cloudflare address. A server-level
# set_real_ip_from replaces NPM's http-level list for this host, so nothing but
# these ranges is trusted here, and a request sent straight to the origin keeps
# its own address whatever headers it forges.
#
# Source: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
# as of this file's last commit. They change rarely; refresh the list if they do.

set_real_ip_from 173.245.48.0/20;
