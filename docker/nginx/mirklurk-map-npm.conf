# NPM host map.mirklurk.danteb.com ONLY: Advanced tab, not Custom Locations.
location ^~ /api/ {
  access_log off;
  error_log /dev/null;
  if ($scheme = http) { return 403; }
  client_max_body_size 64m;
  client_body_timeout 60s;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 75s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # DNS-only origin: use the socket peer, before NPM's global real-IP rewrite.
  # Never forward client-supplied XFF, X-Real-IP or X-Upload-IP as identity.
  proxy_set_header X-Forwarded-For $realip_remote_addr;
  proxy_set_header X-Real-IP $realip_remote_addr;
  proxy_pass $forward_scheme://$server:$port$request_uri;
}
