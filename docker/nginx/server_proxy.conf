# Custom error pages for proxy hosts.
# Mounted read-only at /data/custom and pulled in by the stub
# /data/nginx/custom/server_proxy.conf, which NPM auto-includes in every
# proxy host server block. See compose.core.yml.
#
# A host with its own sites/<primary server_name>/502.html gets that page
# instead of the shared one, e.g. mirklurk.wiki, which must not link to
# danteb.com. Both files live in this read-only mount.

error_page 502 503 504 /502.html;

location = /502.html {
    root /data/custom;
    try_files /sites/$server_name/502.html /502.html =502;
    internal;
}
