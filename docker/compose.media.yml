# Media consumption services
# plex, jellyfin, komga, komf, suwayomi, suwayomi_postgres, calibre-web,
# audiobookshelf, storyteller, librofm-downloader

services:
  plex:
    extends:
      file: compose.common.yml
      service: gpu-service
    container_name: plex
    image: plexinc/pms-docker
    restart: unless-stopped
    ports:
      - "32400:32400/tcp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    environment:
      PLEX_UID: ${HOST_UID}
      PLEX_GID: ${HOST_GID}
      TZ: ${TZ}
      PLEX_CLAIM: ${PLEX_CLAIM}
      ADVERTISE_IP: ${ADVERTISE_IP}
      # Set Plex Settings > Network > LAN Networks to 192.168.50.0/24.
      # pms-docker ignores LAN_NETWORKS; the persisted preference is
      # LanNetworksBandwidth. Do not include the proxy subnet (see docs/PLEX.md).
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      # NixOS CDI mounts the driver here, but Plex Transcoder does not discover
      # libcuda through ldconfig. Keep the paths explicit to prevent CPU fallback.
      LD_LIBRARY_PATH: /usr/local/nvidia/lib64:/usr/local/nvidia/lib
    networks:
      - proxy
    volumes:
      - ${DATA}/plex/config:/config
      - /tmp/plex:/transcode
      - ${RAID}/shared/media:/data/media

  jellyfin:
    extends:
      file: compose.common.yml
      service: gpu-service
    container_name: jellyfin
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.jellyfin
      pull: true
    image: jellyfin-finity:latest
    restart: unless-stopped
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      TZ: ${TZ}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    networks:
      - proxy
      - anime
    volumes:
      - ${DATA}/jellyfin/config:/config
      - ${DATA}/jellyfin/cache:/cache
      - /tmp/jellyfin:/config/transcodes
      - ${RAID}/shared/media:/data/media:ro
      - ${DATA}/jellyfin/webroot/list.txt:/jellyfin/jellyfin-web/list.txt:ro

  anime-relations:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: anime-relations
    build: https://github.com/BeeeQueue/arm-server.git
    image: anime-relations:latest
    hostname: arm-server
    networks:
      - anime

  komga:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: komga
    image: gotson/komga:latest
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=85
      TZ: ${TZ}
    networks:
      - proxy
      - komics
    volumes:
      - ${DATA}/komga/config:/config
      - ${RAID}/shared/reading:/data

  komf:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: komf
    image: sndxr/komf:latest
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      JAVA_TOOL_OPTIONS: -XX:+UnlockExperimentalVMOptions -XX:+UseShenandoahGC -XX:ShenandoahGCHeuristics=compact -XX:ShenandoahGuaranteedGCInterval=3600000 -XX:TrimNativeHeapInterval=3600000
      KOMF_LOG_LEVEL: INFO
      TZ: ${TZ}
    networks:
      - komics
    volumes:
      - ${DATA}/komf/config:/config
    depends_on:
      - komga

  suwayomi:
    container_name: suwayomi
    image: ghcr.io/suwayomi/suwayomi-server:stable
    restart: on-failure:3
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      TZ: ${TZ}
      FLARESOLVERR_ENABLED: true
      FLARESOLVERR_URL: http://flaresolverr:8191
      DATABASE_TYPE: POSTGRESQL
      DATABASE_USERNAME: ${SUWAYOMI_USER}
      DATABASE_PASSWORD: ${SUWAYOMI_PASS}
      DATABASE_URL: postgresql://suwayomi_postgres:5432/${SUWAYOMI_DB}
    depends_on:
      suwayomi_postgres:
        condition: service_healthy
    networks:
      - proxy
      - suwayomi
      - flaresolverr
    volumes:
      - ${RAID}/shared/reading:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${DATA}/suwayomi/config:/home/suwayomi/.local/share/Tachidesk

  suwayomi_postgres:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: suwayomi_postgres
    # Pinned to the major already on disk (PG_VERSION = 18) — see the note on
    # authelia_postgres in compose.auth.yml. Debian variant, not -alpine.
    image: postgres:18
    networks:
      - suwayomi
    volumes:
      - suwayomi-storage:/var/lib/postgresql
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${SUWAYOMI_USER}
      POSTGRES_PASSWORD: ${SUWAYOMI_PASS}
      POSTGRES_DB: ${SUWAYOMI_DB}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ}
      PGTZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${SUWAYOMI_DB} -U ${SUWAYOMI_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  calibre-web:
    extends:
      file: compose.common.yml
      service: linuxserver-service
    container_name: calibre-web
    image: lscr.io/linuxserver/calibre-web:latest
    environment:
      DOCKER_MODS: linuxserver/mods:universal-calibre
    networks:
      - proxy
    volumes:
      - ${DATA}/calibre-web/config:/config
      - ${RAID}/shared/reading/ebooks:/books

  audiobookshelf:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      TZ: ${TZ}
    networks:
      - proxy
    volumes:
      - ${DATA}/audiobookshelf/config:/config
      - ${DATA}/audiobookshelf/metadata:/metadata
      - ${RAID}/shared/reading/audiobooks:/audiobooks

  # Readaloud builder: aligns a Calibre EPUB with an Audiobookshelf audiobook.
  # Both libraries are mounted read-only so Calibre and ABS stay the owners of
  # their files; see docs/AUDIOBOOKS.md for the import workflow.
  storyteller:
    extends:
      file: compose.common.yml
      service: gpu-service
    container_name: storyteller
    # cuda-12.9.0 is upstream's recommendation for CUDA 13.0.x drivers.
    image: registry.gitlab.com/storyteller-platform/storyteller:latest-cuda-12.9.0
    restart: unless-stopped
    # Do not set user: — the entrypoint drops to PUID/PGID itself.
    environment:
      PUID: ${HOST_UID}
      PGID: ${HOST_GID}
      TZ: ${TZ}
      STORYTELLER_SECRET_KEY: ${STORYTELLER_SECRET_KEY}
      STORYTELLER_ASSETS_DIR: /assets
    networks:
      - proxy
    volumes:
      - ${DATA}/storyteller/data:/data
      - ${RAID}/shared/reading/storyteller/assets:/assets
      # Writable fallback import area (EPUB copy + hardlinked audio) for when
      # in-place import from the read-only libraries is not enough.
      - ${RAID}/shared/reading/storyteller/import:/import
      - ${RAID}/shared/reading/ebooks:/library/ebooks:ro
      - ${RAID}/shared/reading/audiobooks:/library/audiobooks:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Progress-sync hub between KOReader (built-in KOSync server), Audiobookshelf
  # and Storyteller. Split-port mode: 5757 = dashboard/API (bookbridge.danteb.com),
  # 5758 = sync-only KOSync + Bridge Sync plugin routes (kosync.danteb.com).
  # Integrations are configured in the web UI; see docs/AUDIOBOOKS.md.
  bookbridge:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: bookbridge
    image: ghcr.io/cporcellijr/bookbridge:latest
    # Runs as root; the image has no PUID/PGID support. Library mounts are :ro.
    environment:
      TZ: ${TZ}
      LOG_LEVEL: INFO
      KOSYNC_PORT: "5758"
      # NPM's address(es) on the proxy network, so KOSync login rate limiting
      # follows each device's X-Forwarded-For instead of NPM's IP.
      KOSYNC_TRUSTED_PROXIES: ${BOOKBRIDGE_KOSYNC_TRUSTED_PROXIES:-}
    networks:
      - proxy
    volumes:
      # Holds database.db and secret.key (credential encryption key) — back up together.
      - ${DATA}/bookbridge/data:/data
      - ${RAID}/shared/reading/ebooks:/books:ro
      # Storyteller transcript ingest; set "Storyteller Assets Path" to /storyteller in the UI.
      # Storyteller ignores STORYTELLER_ASSETS_DIR and writes assets under its data dir.
      - ${DATA}/storyteller/data/assets:/storyteller/assets:ro

  # Downloads new DRM-free purchases from libro.fm into the ABS library.
  # Outbound-only; no web UI is exposed.
  librofm-downloader:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: librofm-downloader
    image: ghcr.io/burntcookie90/librofm-downloader:latest
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      LIBRO_FM_USERNAME: ${LIBRO_FM_USERNAME}
      LIBRO_FM_PASSWORD: ${LIBRO_FM_PASSWORD}
      FORMAT: M4B_CONVERT_FALLBACK
      PATH_PATTERN: FIRST_AUTHOR/BOOK_TITLE
      SYNC_INTERVAL: d
      LOG_LEVEL: INFO
      TZ: ${TZ}
    volumes:
      - ${DATA}/librofm-downloader:/data
      - ${RAID}/shared/reading/audiobooks:/media

networks:
  proxy:
  anime:
  komics:
  suwayomi:
  flaresolverr:

volumes:
  suwayomi-storage:
