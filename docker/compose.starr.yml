# Starr apps and media management
# radarr, radarr-maint, sonarr, sonarr-maint, lidarr, lidarr-maint, bazarr, prowlarr, recyclarr, seerr, aurral, soularr, tdarr

services:
  recyclarr:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: recyclarr
    image: ghcr.io/recyclarr/recyclarr:8.8.0
    environment:
      PUID: ${HOST_UID}
      PGID: ${HOST_GID}
      TZ: ${TZ}
    networks:
      - starr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA}/recyclarr/config:/config

  radarr:
    extends:
      file: compose.common.yml
      service: hotio-service
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    networks:
      - proxy
      - starr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA}/radarr/config:/config
      - ${RAID}/shared:/data

  sonarr:
    extends:
      file: compose.common.yml
      service: hotio-service
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    networks:
      - proxy
      - starr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA}/sonarr/config:/config
      - ${RAID}/shared:/data

  lidarr:
    extends:
      file: compose.common.yml
      service: hotio-service
    container_name: lidarr
    image: ghcr.io/hotio/lidarr:latest
    environment:
      UMASK: "002"
    networks:
      - proxy
      - starr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA}/lidarr/config:/config
      - ${RAID}/shared:/data

  bazarr:
    extends:
      file: compose.common.yml
      service: hotio-service
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:nightly
    networks:
      - proxy
      - starr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA}/bazarr/config:/config
      - ${RAID}/shared/media:/data/media

  seerr:
    extends:
      file: compose.common.yml
      service: hotio-service
    image: ghcr.io/hotio/seerr:latest
    container_name: seerr
    environment:
      LOG_LEVEL: debug
      UMASK: "002"
    networks:
      - proxy
      - starr
    volumes:
      - ${DATA}/seerr/config:/config

  # Seerr-style music requests and discovery. Album/artist requests go to
  # Lidarr; it reads Lidarr's files at the same /data paths. See docs/MUSIC.md.
  aurral:
    extends:
      file: compose.common.yml
      service: common-service
    image: ghcr.io/lklynet/aurral:latest
    container_name: aurral
    environment:
      PUID: ${HOST_UID}
      PGID: ${HOST_GID}
      TZ: ${TZ}
      # Download clients are off (Lidarr is the only download path); this
      # just keeps Aurral's empty download folder out of /data/downloads.
      DOWNLOAD_FOLDER: /data/media/aurral
    networks:
      - proxy
      - starr
    volumes:
      - ${DATA}/aurral/config:/config
      - ${RAID}/shared:/data

  prowlarr:
    extends:
      file: compose.common.yml
      service: hotio-service
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    environment:
      UMASK: "002"
      # FlareSolverr's Chromium solves Cloudflare challenges over IPv4, and
      # cf_clearance is bound to the solving IP. Prowlarr (on the IPv6 proxy
      # network) would replay that cookie over IPv6 and get 403 "blocked by
      # CloudFlare Protection". Keep Prowlarr's outbound traffic on IPv4.
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
    networks:
      - proxy
      - starr
      - flaresolverr
    volumes:
      - ${DATA}/prowlarr/config:/config

  # Feeds Lidarr's wanted albums to slskd (Soulseek) and triggers the import.
  # Config (API keys) lives in ${DATA}/soularr/config.ini; see docs/MUSIC.md.
  soularr:
    extends:
      file: compose.common.yml
      service: common-service
    image: mrusse08/soularr:latest
    container_name: soularr
    hostname: soularr
    user: ${HOST_UID}:${HOST_GID}
    environment:
      TZ: ${TZ}
      SCRIPT_INTERVAL: 300
      WEBUI_ENABLED: "true"
      WEBUI_PORT: 8265
    networks:
      - proxy
      - starr
    volumes:
      - ${DATA}/soularr:/data
      - ${RAID}/shared/soulseek/downloads:/downloads

  # Unattended queue fixers, one container per app from one image
  # (dockerfiles/arr-maint: shared engine + lidarr.py/radarr.py/sonarr.py rules).
  # They fix known stuck patterns and send ntfy for anything they can't fix.
  # On proxy only to reach qBittorrent (vpn-netns has no other network).
  # See docs/MUSIC.md, docs/RADARR.md and docs/SONARR.md ("Queue maintenance").
  lidarr-maint: &arr-maint
    extends:
      file: compose.common.yml
      service: common-service
    image: arr-maint
    build:
      context: dockerfiles/arr-maint
    container_name: lidarr-maint
    user: ${HOST_UID}:${HOST_GID}
    environment: &arr-maint-env
      APP: lidarr
      TZ: ${TZ}
      INTERVAL: 1800
      QBIT_USER: ${QUSER}
      QBIT_PASS: ${QPASS}
      NTFY_URL: https://ntfy.danteb.com
      NTFY_TOPIC: homeserver-alerts
    networks:
      - proxy
      - starr
    volumes:
      - ${DATA}/lidarr/config/config.xml:/lidarr/config.xml:ro
      - ${DATA}/lidarr-maint:/state
      # Same /data paths as the *arrs; read-only because the *arrs do the imports.
      - ${RAID}/shared:/data:ro
    depends_on:
      - lidarr

  radarr-maint:
    <<: *arr-maint
    container_name: radarr-maint
    environment:
      <<: *arr-maint-env
      APP: radarr
    volumes:
      - ${DATA}/radarr/config/config.xml:/radarr/config.xml:ro
      - ${DATA}/radarr-maint:/state
      - ${RAID}/shared:/data:ro
    depends_on:
      - radarr

  sonarr-maint:
    <<: *arr-maint
    container_name: sonarr-maint
    environment:
      <<: *arr-maint-env
      APP: sonarr
    volumes:
      - ${DATA}/sonarr/config/config.xml:/sonarr/config.xml:ro
      - ${DATA}/sonarr-maint:/state
      - ${RAID}/shared:/data:ro
    depends_on:
      - sonarr

  tdarr:
    extends:
      file: compose.common.yml
      service: gpu-service
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 12
    environment:
      PUID: ${HOST_UID}
      PGID: ${HOST_GID}
      TZ: ${TZ}
      UMASK_SET: "002"
      serverIP: 0.0.0.0
      serverPort: 8266
      serverURL: http://127.0.0.1:8266
      webUIPort: 8265
      internalNode: true
      inContainer: true
      ffmpegVersion: 7
      # Avoid Tdarr's image-wide glibc path overriding NixOS CDI utility libraries.
      LD_LIBRARY_PATH: /usr/local/nvidia/lib64:/usr/local/nvidia/lib
      nodeName: HomeServer
      auth: true
      apiKey: ${TDARR_API_KEY}
      maxLogSizeMB: 10
      transcodecpuWorkers: 4
      transcodegpuWorkers: 1
      healthcheckcpuWorkers: 4
      healthcheckgpuWorkers: 0
    networks:
      - proxy
      - starr
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA}/tdarr/server:/app/server
      - ${DATA}/tdarr/configs:/app/configs
      - ${DATA}/tdarr/logs:/app/logs
      - ${RAID}/shared/media:/data/media
      - /tmp/tdarr_transcode_cache:/temp

networks:
  proxy:
  starr:
  flaresolverr:
