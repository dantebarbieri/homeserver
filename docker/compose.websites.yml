# Web hosting services
# Uncomment services as needed

services:
  mirklurk:
    extends:
      file: compose.common.yml
      service: common-service
    image: mirklurk-wiki:local
    build:
      context: ${MIRKLURK_WIKI_PATH:?Set MIRKLURK_WIKI_PATH in .env}
      dockerfile: deploy/Dockerfile
    container_name: mirklurk
    environment:
      MW_SERVER_URL: ${MIRKLURK_SERVER_URL:-https://wiki.mirklurk.danteb.com}
      MW_TRUSTED_PROXY_CIDRS: ${MIRKLURK_TRUSTED_PROXY_CIDRS:?Set the exact trusted reverse-proxy IPs/CIDRs in .env}
      MW_READ_ONLY: ${MIRKLURK_READ_ONLY:-}
      MW_DB_SERVER: mirklurk-db
      MW_DB_NAME: mirklurk
      MW_DB_USER: mirklurk
      MW_DB_PASSWORD_FILE: /run/secrets/MIRKLURK_DB_PASSWORD
      MW_SECRET_KEY_FILE: /run/secrets/MIRKLURK_SECRET_KEY
      MW_UPGRADE_KEY_FILE: /run/secrets/MIRKLURK_UPGRADE_KEY
      MW_CAPTCHA_QUESTIONS_FILE: /run/secrets/MIRKLURK_CAPTCHA_QUESTIONS
    secrets:
      - MIRKLURK_DB_PASSWORD
      - MIRKLURK_SECRET_KEY
      - MIRKLURK_UPGRADE_KEY
      - MIRKLURK_CAPTCHA_QUESTIONS
    volumes:
      - type: bind
        source: ${DATA}/mirklurk/images
        target: /var/www/html/images
        bind:
          create_host_path: false
    networks:
      - proxy
      - mirklurk
    depends_on:
      mirklurk-db:
        condition: service_healthy

  mirklurk-db:
    extends:
      file: compose.common.yml
      service: common-service
    image: &mirklurk-mariadb mariadb:11.4.13@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    container_name: mirklurk-db
    environment:
      MARIADB_DATABASE: mirklurk
      MARIADB_USER: mirklurk
      MARIADB_PASSWORD_FILE: /run/secrets/MIRKLURK_DB_PASSWORD
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/MIRKLURK_DB_ROOT_PASSWORD
      TZ: ${TZ}
    secrets:
      - MIRKLURK_DB_PASSWORD
      - MIRKLURK_DB_ROOT_PASSWORD
    volumes:
      - mirklurk-db:/var/lib/mysql
    networks:
      - mirklurk
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 30s
      timeout: 5s
      retries: 5

  mirklurk-backup:
    extends:
      file: compose.common.yml
      service: common-service
    image: *mirklurk-mariadb
    container_name: mirklurk-backup
    init: true
    user: "${UID}:${GID}"
    entrypoint: ["bash", "/opt/mirklurk-backup.sh"]
    command: []
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
      - /var/lib/mysql:size=1m
    environment:
      MW_DB_SERVER: mirklurk-db
      MW_DB_NAME: mirklurk
      MW_DB_USER: mirklurk
      MW_DB_PASSWORD_FILE: /run/secrets/MIRKLURK_DB_PASSWORD
    secrets:
      - MIRKLURK_DB_PASSWORD
    volumes:
      - ./scripts/mirklurk-backup.sh:/opt/mirklurk-backup.sh:ro
      - type: bind
        source: ${DATA}/mirklurk/backups
        target: /backups
        bind:
          create_host_path: false
    networks:
      - mirklurk
    depends_on:
      mirklurk-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/opt/mirklurk-backup.sh", "--healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m

  travel-planner:
    build:
      context: ${TRAVEL_PLANNER_PATH:?Set TRAVEL_PLANNER_PATH in .env}
      dockerfile: Dockerfile
    container_name: travel-planner
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: ${TRAVEL_PLANNER_PATH:?Set TRAVEL_PLANNER_PATH in .env}/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: https://travel.danteb.com
      DATABASE_PATH: /app/data/cache.db
      TRUST_PROXY: "true"
    volumes:
      - ${DATA}/travel-planner:/app/data
    networks:
      proxy:
        aliases:
          - travel-planner

  recipe:
    extends:
      file: compose.common.yml
      service: common-service
    image: recipe-app
    build:
      context: ${RECIPE_APP_PATH:?Set RECIPE_APP_PATH in .env}
      dockerfile: Dockerfile
    container_name: recipe
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: https://recipe.danteb.com
      RECIPE_DATA_DIR: /app/data/recipes
    volumes:
      - ${DATA}/recipe/recipes:/app/data/recipes
    networks:
      proxy:
        aliases:
          - recipe

  skyjo:
    extends:
      file: compose.common.yml
      service: common-service
    image: skyjo-frontend
    build:
      context: ${SKYJO_PATH:?Set SKYJO_PATH in .env}
      dockerfile: docker/frontend.Dockerfile
    container_name: skyjo
    networks:
      proxy:
        aliases:
          - skyjo
      skyjo:
    # The image's baked HEALTHCHECK hits http://localhost/, which busybox wget
    # resolves to ::1 first — but nginx inside the container only binds IPv4,
    # so the check fails with "Connection refused". Force IPv4.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  skyjo_server:
    extends:
      file: compose.common.yml
      service: common-service
    image: skyjo-server
    build:
      context: ${SKYJO_PATH:?Set SKYJO_PATH in .env}
      dockerfile: docker/backend.Dockerfile
    container_name: skyjo_server
    networks:
      skyjo:
        aliases:
          - backend
    environment:
      DATABASE_URL: postgres://skyjo:${SKYJO_DB_PASSWORD:-skyjo}@db:5432/skyjo
      SKYJO_JWT_SECRET: ${SKYJO_JWT_SECRET}
      SKYJO_DATA_DIR: /var/lib/skyjo
    volumes:
      - skyjo-data:/var/lib/skyjo
    depends_on:
      skyjo_postgres:
        condition: service_healthy

  skyjo_postgres:
    extends:
      file: compose.common.yml
      service: common-service
    container_name: skyjo_postgres
    image: postgres:17-alpine
    networks:
      skyjo:
        aliases:
          - db
    volumes:
      - skyjo-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: skyjo
      POSTGRES_PASSWORD: ${SKYJO_DB_PASSWORD:-skyjo}
      POSTGRES_DB: skyjo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyjo -d skyjo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # sorry.danteb.com — online Sorry! game + simulator
  # Two containers sharing an internal `sorry` network:
  #   sorry (nginx) serves the SvelteKit static build and proxies /api/* +
  #   /api/rooms/<code>/ws → sorry_server:8080. Only `sorry` joins `proxy`.
  sorry:
    extends:
      file: compose.common.yml
      service: common-service
    image: sorry-frontend
    build:
      context: ${SORRY_PATH:?Set SORRY_PATH in .env}
      dockerfile: docker/frontend.Dockerfile
    container_name: sorry
    networks:
      proxy:
        aliases:
          - sorry
          # NPM proxy host for sorry.danteb.com targets the `sorry-game`
          # upstream, matching the repo name. Keep the alias so the
          # reverse proxy config doesn't need to change.
          - sorry-game
      sorry:
    # Baked HEALTHCHECK in frontend.Dockerfile hits 127.0.0.1/ — explicit
    # here as well so an image rebuild without the HEALTHCHECK line still
    # gets a working check.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      sorry_server:
        condition: service_started

  sorry_server:
    extends:
      file: compose.common.yml
      service: common-service
    image: sorry-server
    build:
      context: ${SORRY_PATH:?Set SORRY_PATH in .env}
      dockerfile: docker/backend.Dockerfile
    container_name: sorry_server
    networks:
      sorry:
        aliases:
          - backend
    environment:
      SORRY_PORT: 8080
      # Same-origin deploy — nginx in `sorry` proxies /api/* under the same
      # hostname, so the server never needs to emit CORS headers.
      SORRY_CORS_ORIGIN: ""
      RUST_LOG: sorry_server=info,tower_http=info

