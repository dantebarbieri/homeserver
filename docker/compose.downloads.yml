# Download services
# VPN stacks (vpn-netns/gluetun/qbittorrent/qbit-port-sync and
# slskd-netns/gluetun-slskd/slskd/slskd-port-sync), sabnzbd, flaresolverr

services:
  vpn-netns:
    image: registry.k8s.io/pause:3.10.2
    container_name: vpn-netns
    networks:
      proxy:
        aliases:
          - qbittorrent
    restart: always

  gluetun:
    extends:
      file: compose.common.yml
      service: common-service
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    network_mode: "container:vpn-netns"
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    # Shell wrapper flushes stale WireGuard ip rules left in the pause container's
    # netns from prior gluetun runs. Without this, gluetun restarts loop on
    # "adding ip rule 101: ... file exists" with exponential backoff up to 32m.
    # https://github.com/qdm12/gluetun-wiki/blob/main/setup/advanced/kubernetes.md
    entrypoint:
      - /bin/sh
      - -c
      - |
        ip rule del table 51820 2>/dev/null || true
        ip -6 rule del table 51820 2>/dev/null || true
        exec /gluetun-entrypoint
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WG_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WG_ADDRESS}
      SERVER_COUNTRIES: ${SERVER_COUNTRY}
      SERVER_CITIES: ${SERVER_CITIES}
      PORT_FORWARD_ONLY: on
      VPN_PORT_FORWARDING: on
      TZ: ${TZ}
      # No FIREWALL_OUTBOUND_SUBNETS: every subnet listed there is a route that
      # bypasses the tunnel, so the list stays empty and all torrent traffic exits
      # via tun0 only. Nothing needs a bypass:
      #   - gluetun auto-exempts its own Docker subnet ("local ipnet found" at
      #     startup), so NPM reaches the web UI on the proxy network without help.
      #     Hardcoding it also goes stale -- Compose does not pin the proxy subnet.
      #   - vpn-netns publishes no host ports, so there is no LAN path to allow.
      FIREWALL_INPUT_PORTS: 8080
    volumes:
      - ${DATA}/gluetun:/gluetun
      - gluetun-tmp:/tmp/gluetun
    depends_on: [vpn-netns]

  qbittorrent:
    extends:
      file: compose.common.yml
      service: linuxserver-service
    image: qbittorrent-vuetorrent
    build:
      context: dockerfiles
      dockerfile: Dockerfile.qbittorrent
    container_name: qbittorrent-app
    network_mode: "container:vpn-netns"
    volumes:
      - ${DATA}/qbittorrent/config:/config
      - ${RAID}/shared/torrents:/data/torrents
      - ${OPENCLAW_V3_BASE:-/data/openclaw-v3}/zim:/data/openclaw-zim
      - ${DATA}/qbittorrent/iQbit/release:/iqbit
    depends_on:
      gluetun:
        condition: service_healthy
      vpn-netns:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: always

  qbit-port-sync:
    extends:
      file: compose.common.yml
      service: common-service
    image: qbit-port-sync
    build:
      context: dockerfiles/port-sync
    network_mode: "container:vpn-netns"
    environment:
      QUSER: ${QUSER}
      QPASS: ${QPASS}
      PORT_FILE: /tmp/gluetun/forwarded_port
      QHOST: 127.0.0.1:8080
      CHECK_INTERVAL: 300
      NTFY_URL: https://ntfy.danteb.com
      NTFY_TOPIC: homeserver-alerts
    volumes:
      - gluetun-tmp:/tmp/gluetun:ro
    depends_on:
      gluetun:
        condition: service_healthy
      vpn-netns:
        condition: service_started
      qbittorrent:
        condition: service_healthy

  # Soulseek stack: a second ProtonVPN WireGuard tunnel, separate from
  # qBittorrent's, because Proton forwards exactly one port per tunnel and
  # qBittorrent owns the first one. slskd-port-sync pushes this tunnel's
  # forwarded port into slskd so peers can connect in. Web UI/API on 5030 via
  # the `slskd` alias on slskd-netns. Soularr (compose.starr.yml) drives it.
  slskd-netns:
    image: registry.k8s.io/pause:3.10.2
    container_name: slskd-netns
    networks:
      proxy:
        aliases:
          - slskd
    restart: always

  gluetun-slskd:
    extends:
      service: gluetun
    container_name: gluetun-slskd
    network_mode: "container:slskd-netns"
    environment:
      WIREGUARD_PRIVATE_KEY: ${SLSKD_WG_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${SLSKD_WG_ADDRESS}
      FIREWALL_INPUT_PORTS: 5030
    volumes: !override
      - ${DATA}/gluetun-slskd:/gluetun
      - gluetun-slskd-tmp:/tmp/gluetun
    depends_on: !override
      - slskd-netns

  slskd:
    extends:
      file: compose.common.yml
      service: common-service
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: "container:slskd-netns"
    user: ${HOST_UID}:${HOST_GID}
    environment:
      TZ: ${TZ}
      SLSKD_UMASK: "002"
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD}
      SLSKD_USERNAME: ${SLSKD_WEB_USERNAME}
      SLSKD_PASSWORD: ${SLSKD_WEB_PASSWORD}
      SLSKD_JWT_KEY: ${SLSKD_JWT_KEY}
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      # Required: slskd-port-sync PATCHes the listen port through the options API,
      # which returns 403 when remote configuration is disabled.
      SLSKD_REMOTE_CONFIGURATION: "true"
      # Same /data/soulseek path Lidarr sees via ${RAID}/shared:/data, on the
      # same filesystem as the music root, so imports are instant moves.
      SLSKD_DOWNLOADS_DIR: /data/soulseek/downloads
      SLSKD_INCOMPLETE_DIR: /data/soulseek/incomplete
      # Share the library back (read-only); many peers ignore non-sharers.
      SLSKD_SHARED_DIR: "[Music]/music"
      SLSKD_SHARE_CACHE_RETENTION: "1440"
    volumes:
      - ${DATA}/slskd:/app
      - ${RAID}/shared/soulseek:/data/soulseek
      - ${RAID}/shared/media/music:/music:ro
    depends_on:
      gluetun-slskd:
        condition: service_healthy
      slskd-netns:
        condition: service_started
    restart: always

  slskd-port-sync:
    extends:
      file: compose.common.yml
      service: common-service
    image: slskd-port-sync
    build:
      context: dockerfiles/slskd-port-sync
    container_name: slskd-port-sync
    network_mode: "container:slskd-netns"
    environment:
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      SLSKD_HOST: 127.0.0.1:5030
      PORT_FILE: /tmp/gluetun/forwarded_port
      CHECK_INTERVAL: 60
      NTFY_URL: https://ntfy.danteb.com
      NTFY_TOPIC: homeserver-alerts
    volumes:
      - gluetun-slskd-tmp:/tmp/gluetun:ro
    depends_on:
      gluetun-slskd:
        condition: service_healthy
      slskd-netns:
        condition: service_started
      slskd:
        condition: service_started
  sabnzbd:
    extends:
      file: compose.common.yml
      service: hotio-service
    container_name: sabnzbd
    image: ghcr.io/hotio/sabnzbd:latest
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA}/sabnzbd/config:/config
      - ${RAID}/shared/usenet:/data/usenet:rw

  flaresolverr:
    extends:
      file: compose.common.yml
      service: common-service
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      PUID: ${HOST_UID}
      PGID: ${HOST_GID}
      TZ: ${TZ}
    networks:
      - flaresolverr

  qbit-manage:
    extends:
      file: compose.common.yml
      service: common-service
    image: qbit-manage-inactivity:4.14.0-2
    build:
      context: dockerfiles/qbit-manage
    container_name: qbit-manage
    profiles: ["qbit-manage"]
    network_mode: "container:vpn-netns"
    environment:
      QBT_RUN: false
      QBT_SCHEDULE: 30
      QBT_CONFIG: /config/config.yml
      QBT_LOGFILE: /config/logs/qbitmanage.log
      QBT_CROSS_SEED: false
      QBT_RECHECK: false
      QBT_CAT_UPDATE: true
      QBT_TAG_UPDATE: true
      QBT_REM_UNREGISTERED: true
      QBT_REM_ORPHANED: false
      QBT_TAG_NOHARDLINKS: true
      QBT_SHARE_LIMITS: true
      QBT_SKIP_CLEANUP: false
      QBT_DRY_RUN: true
      QBT_LOG_LEVEL: INFO
      QBT_DIVIDER: "="
      QBT_WIDTH: 100
    volumes:
      - ${DATA}/qbit-manage/config:/config:rw
      - type: bind
        source: ${DATA}/qbittorrent/config/qBittorrent/BT_backup
        target: /qbittorrent/BT_backup
        read_only: true
        bind:
          create_host_path: false
      - ${RAID}/shared/torrents:/data/torrents:rw
    depends_on:
      qbittorrent:
        condition: service_healthy
      vpn-netns:
        condition: service_started

  vpn-netns-watcher:
    extends:
      file: compose.common.yml
      service: common-service
    image: vpn-netns-watcher
    build:
      context: dockerfiles/vpn-netns-watcher
    container_name: vpn-netns-watcher
    environment:
      NETNS_CONTAINER: vpn-netns
      NETNS_SERVICE: vpn-netns
      SIBLING_SERVICES: gluetun qbittorrent qbit-port-sync
      COMPOSE_DIR: /compose
      DEBOUNCE: "30"
      SETTLE: "3"
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_PATH}/docker:/compose:ro
    depends_on:
      vpn-netns:
        condition: service_started

  slskd-netns-watcher:
    extends:
      service: vpn-netns-watcher
    container_name: slskd-netns-watcher
    environment:
      NETNS_CONTAINER: slskd-netns
      NETNS_SERVICE: slskd-netns
      SIBLING_SERVICES: gluetun-slskd slskd slskd-port-sync
    depends_on: !override
      slskd-netns:
        condition: service_started

volumes:
  gluetun-tmp:
  gluetun-slskd-tmp:

networks:
  proxy:
  flaresolverr:
