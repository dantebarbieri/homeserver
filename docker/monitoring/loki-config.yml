# Loki configuration — single-node, filesystem storage, 30-day retention
# Mounted read-only into the Loki container

auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: "2020-05-15"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  retention_period: 720h
  # Query-time cap only (ingestion limits are unchanged). The attacks dashboard counts
  # per source IP so it can join AbuseIPDB grades outside LogQL; 30 days is ~1k series,
  # well past the default 500.
  max_query_series: 20000
  # Each split is a separately scheduled sub-query. At the 1h defaults a 30-day query was
  # 720 of them queued through four workers: ~5s of scheduling for 9 MB of attacks data.
  # Day-sized splits make those queries ~0.1s and left heavy container-log queries no slower.
  split_queries_by_interval: 24h
  split_instant_metric_queries_by_interval: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_cancel_period: 10m
  retention_delete_delay: 2h
  delete_request_store: filesystem

querier:
  # The default 4 leaves most of the 32-core host idle while sub-queries wait in the queue.
  max_concurrent: 16
