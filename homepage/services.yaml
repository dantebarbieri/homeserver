# Services dashboard with Docker status monitoring
# https://gethomepage.dev/configs/services/
#
# Web apps have:
#   - siteMonitor: checks if the web UI is reachable (green/red dot)
#   - server/container: shows Docker container running status + stats
#   - widget: 2-4 metric tiles, or two version/uptime fallback tiles
# Backend cards use Docker status without linking to API-only endpoints.
# Tab assignment and display order are defined in settings.yaml.
#
# Widget API keys are placeholders — replace {{HOMEPAGE_VAR_*}} values
# through docker/.env and the homepage container's explicit environment.
# Never put real credentials in this tracked file.

- Watch & Request:
    - Plex:
        icon: plex.svg
        href: https://plex.danteb.com
        description: Movies, TV & Music
        siteMonitor: https://plex.danteb.com
        server: my-docker
        container: plex
        widget:
          type: plex
          url: http://plex:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.danteb.com
        description: Movies & TV
        siteMonitor: https://jellyfin.danteb.com
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableNowPlaying: true
    - Seerr:
        icon: seerr.svg
        href: https://seerr.danteb.com
        description: Request Content
        siteMonitor: https://seerr.danteb.com
        server: my-docker
        container: seerr
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
    - Aurral:
        icon: aurral.svg
        href: https://aurral.danteb.com
        description: Request Music
        siteMonitor: https://aurral.danteb.com
        server: my-docker
        container: aurral
        widget:
          <<: &container-info
            type: customapi
            refreshInterval: 30000
            display: block
            mappings:
              - field: version
                label: App / Build
                format: text
              - field: uptime
                label: Uptime
                format: text
          url: http://homepage-inventory:8080/stats/aurral
          mappings:
            - field: songs
              label: Songs
              format: text
            - field: albums
              label: Albums
              format: text
            - field: artists
              label: Artists
              format: text
            - field: requests
              label: Requests (30d)
              format: text

