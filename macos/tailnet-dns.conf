# Only the tailnet view of home.arpa; AdGuard keeps serving LAN addresses.
listen-address=100.94.21.37
bind-interfaces
port=53
user=nobody
group=nobody
pid-file=
log-facility=-
no-resolv
no-hosts
cache-size=0
local-ttl=30
local=/home.arpa/

host-record=calcifer.home.arpa,homeserver.home.arpa,100.104.46.115
host-record=no-face.home.arpa,ai-studio.home.arpa,100.94.21.37
host-record=totoro.home.arpa,dante-pc.home.arpa,100.113.62.81
host-record=okkoto.home.arpa,100.117.244.102

# These appliances cannot run Tailscale; No-Face advertises their /32 routes.
host-record=router.home.arpa,192.168.50.1
host-record=bmc.home.arpa,192.168.50.50
host-record=modem.home.arpa,192.168.100.1
