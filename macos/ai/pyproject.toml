[project]
name = "studio-whisper-adapter"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "python-multipart==0.0.33",
  "numpy>=2,<3",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper==1.2.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "ctranslate2==4.8.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["httpx==0.28.1"]
