# Maintenance can reach only Ollama, not Whisper or an SSH session.
Match User _arrmaint
    AuthorizedKeysFile /etc/ssh/arr-maint-forwarding-keys
    AuthenticationMethods publickey
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:11434
    PermitListen none
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 0
    ForceCommand /usr/bin/false
