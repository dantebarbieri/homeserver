# Bazarr's SSH identity may only forward to the loopback Whisper API.
# The key file must stay paired with this block: an ordinary authorized_keys
# entry would not carry these restrictions.
Match User _bazarr
    AuthorizedKeysFile /etc/ssh/bazarr-forwarding-keys
    AuthenticationMethods publickey
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:9000
    PermitListen none
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/bin/false
