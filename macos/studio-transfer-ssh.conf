Host studio-transfer
    HostName homeserver.home.arpa
    Port 28
    User studio-tunnel
    IdentityFile /var/lib/studio-worker/.ssh/id_ed25519_transfer
    UserKnownHostsFile /var/lib/studio-worker/.ssh/known_hosts
    IdentitiesOnly yes
    BatchMode yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    StrictHostKeyChecking yes
    ExitOnForwardFailure yes
    ServerAliveInterval 15
    ServerAliveCountMax 3
