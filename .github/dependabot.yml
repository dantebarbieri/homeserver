version: 2
# Add these public hosts to the Compose job's egress allowlist without credentials.
registries:
  forgejo:
    type: docker-registry
    url: https://data.forgejo.org
  gitlab:
    type: docker-registry
    url: https://registry.gitlab.com

updates:
  # Python requirements in the custom MCP server images
  # (docker/dockerfiles/mcp-*/requirements.txt)
  - package-ecosystem: "pip"
    directories:
      - "/docker/dockerfiles/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      mcp-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images in our custom Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/docker/dockerfiles"
      - "/docker/dockerfiles/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dockerfile-bases:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # opentopodata v1.9.0 pins pylibmc==1.6.3 (no cp312+ wheels) and
      # numpy/pyproj/rasterio versions whose newest wheels are cp311. Hold
      # the base image at 3.11 until we bump opentopodata itself. The
      # grouped minor/patch policy treats 3.x → 3.y on the `python` tag as
      # "minor", so we need this explicit hold.
      - dependency-name: "python"
        directories: ["/docker/dockerfiles/opentopodata"]

  # Image tags in the compose files
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    registries: ["forgejo", "gitlab"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      compose-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Local build output; the Dockerfile job tracks its actual qbit_manage base.
      - dependency-name: "qbit-manage-inactivity"
      # Postgres major bumps require pg_upgrade on on-disk data — handle manually.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Both Compose files report "mariadb". Keep wiki/backup on 11.x;
      # RomM already receives all 12.x fixes via its rolling :12 tag.
      # Revisit this ceiling if either service changes its pinning policy.
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major"]
        versions: [">= 12"]
      # Immich's postgres image is version-coupled to Immich itself (vector
      # extension compatibility window). Bump only alongside Immich upgrades.
      # Same applies to pgvecto.rs — a past auto-bump to 0.4 took Immich down.
      # Dependabot reports the ghcr.io image as "immich-app/postgres", so the
      # registry-less name is what actually matches (PR #25 slipped through
      # with only the prefixed name listed).
      - dependency-name: "ghcr.io/immich-app/postgres"
      - dependency-name: "immich-app/postgres"
      - dependency-name: "tensorchord/pgvecto-rs"

  # GitHub Actions workflow pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
