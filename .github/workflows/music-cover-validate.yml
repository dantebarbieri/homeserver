name: Validate Music Fallbacks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/music-cover-validate.yml
      - docker/dockerfiles/music-cover-fallback/**
      - docker/tests/test_music_cover_fallback.py
      - docker/dockerfiles/music-lyrics-fallback/**
      - docker/tests/test_music_lyrics_fallback.py
      - docker/compose.media.yml
      - docker/compose.starr.yml
  pull_request:
    paths:
      - .github/workflows/music-cover-validate.yml
      - docker/dockerfiles/music-cover-fallback/**
      - docker/tests/test_music_cover_fallback.py
      - docker/dockerfiles/music-lyrics-fallback/**
      - docker/tests/test_music_lyrics_fallback.py
      - docker/compose.media.yml
      - docker/compose.starr.yml

permissions:
  contents: read

jobs:
  fallbacks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - helper: music-cover-fallback
            test: test_music_cover_fallback.py
          - helper: music-lyrics-fallback
            test: test_music_lyrics_fallback.py
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Exercise matching and file-safety safeguards
        run: >-
          uv run --no-project --with-requirements docker/dockerfiles/${{ matrix.helper }}/requirements.txt
          python -B -m unittest discover -s docker/tests -p '${{ matrix.test }}'
      - name: Build and verify non-root import
        run: docker build -q docker/dockerfiles/${{ matrix.helper }}
