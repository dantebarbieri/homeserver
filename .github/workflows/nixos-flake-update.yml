name: Update NixOS Flake Inputs

# Keeps nixos/flake.lock current so the server's nightly nixos-upgrade (04:30
# America/Chicago) picks up fixes. Runs before the 04:00 repo pull and only
# commits a lock that evaluates and passes the regression checks.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nixos-flake-update
  cancel-in-progress: false

# Explicit bash adds -o pipefail, so a failed `nix flake update | tee` fails
# the run instead of looking like "no changes".
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        id: update
        run: |
          nix flake update --flake ./nixos 2>&1 | tee "$RUNNER_TEMP/update.log"
          if git diff --quiet -- nixos/flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate the homeserver system from the new lock
        if: steps.update.outputs.changed == 'true'
        run: |
          nix eval --raw --no-update-lock-file \
            ./nixos#nixosConfigurations.homeserver.config.system.build.toplevel.drvPath

      - name: Run NixOS regression checks
        if: steps.update.outputs.changed == 'true'
        run: python3 -B nixos/tests/test_health_cleanup.py -v

      # GITHUB_TOKEN pushes do not trigger other workflows, so the checks above
      # are the gate. A rejected push (main moved) fails here and retries tomorrow.
      - name: Commit and push the lock
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nixos/flake.lock
          git commit -q -m "Update NixOS flake inputs" \
            -m "$(sed -n '/Updated input/,$p' "$RUNNER_TEMP/update.log")"
          git push origin "HEAD:${GITHUB_REF_NAME}"
