name: Validate NixOS Config

on:
  push:
    paths:
      - nixos/**
      - scripts/wake-pc.nix
      - docker/scripts/mirklurk-backup.sh
      - docker/scripts/reconcile-docker-socket-consumers.sh
      - docker/scripts/restart-daemon-interrupted-containers.py
      - docker/tests/test_restart_daemon_interrupted_containers.py
      - .github/workflows/nixos-*.yml
  pull_request:
    paths:
      - nixos/**
      - scripts/wake-pc.nix
      - docker/scripts/mirklurk-backup.sh
      - docker/scripts/reconcile-docker-socket-consumers.sh
      - docker/scripts/restart-daemon-interrupted-containers.py
      - docker/tests/test_restart_daemon_interrupted_containers.py
      - .github/workflows/nixos-*.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      # Evaluating the toplevel catches option, type, and assertion errors and
      # proves flake.lock is complete. Building it would need the unfree NVIDIA
      # driver, which no binary cache serves.
      - name: Evaluate the homeserver system from the committed lock
        run: |
          nix eval --raw --no-update-lock-file \
            ./nixos#nixosConfigurations.homeserver.config.system.build.toplevel.drvPath

      - name: Run NixOS regression checks
        run: python3 -B -m unittest discover -s nixos/tests -p 'test_*.py' -v

      - name: Exercise the restart of daemon-interrupted containers
        run: python3 -B -m unittest discover -s docker/tests -p 'test_restart_daemon_interrupted_containers.py' -v
